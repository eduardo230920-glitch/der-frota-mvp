{% extends "base.html" %}
{% block title %}Acesso | DER-DF{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center login-area">
  <div class="col-sm-10 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-mark mb-3">DER</div>
          <h1 class="h4">Gestão de Manutenção da Frota</h1>
          <p class="text-secondary mb-0">Departamento de Estradas de Rodagem do Distrito Federal</p>
        </div>
        <form method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="username" class="form-label">Usuário</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <div class="demo-note mt-4">
          <strong>Acesso demonstrativo</strong><br>
          Usuário: <code>servidor.der</code><br>
          Senha: <code>Der@12345</code>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
